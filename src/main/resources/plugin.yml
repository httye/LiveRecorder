name: LiveRecorder
version: ${project.version}
main: com.liverecorder.LiveRecorder
api-version: 1.16
description: 无人机式自由录制者管理系统 - 面向直播/录屏场景
author: LiveRecorder Team

commands:
  liverecorder:
    description: LiveRecorder 主命令
    usage: /<command> <bind|unbind|list|mode|switch|reload>
    aliases: [lr]
    permission: liverecorder.admin

permissions:
  liverecorder.admin:
    description: 允许使用所有 LiveRecorder 命令
    default: op
  liverecorder.recorder:
    description: 录制者权限
    default: false